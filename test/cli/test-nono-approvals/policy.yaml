apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: nono-shell-policy
spec:
  evaluation:
    mode: Nono
  failurePolicy: Fail
  validations:
    - expression: >
        object.request.capability_type == "command" &&
        object.request.command == "kubectl" &&
        object.request.argv().exists(a, a == "get")
        ? nono.Grant()
        : nono.Deny("only kubectl get is allowed")
      message: "command not permitted"
